<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeML Chat - AI 算法专家</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #07070f;
      --bg-secondary: #0d0d1a;
      --bg-tertiary: #05050a;
      --border: rgba(255, 255, 255, 0.1);
      --text-primary: #e6edf3;
      --text-secondary: #7d8590;
      --violet-400: #a78bfa;
      --violet-500: #8b5cf6;
      --violet-600: #7c3aed;
      --cyan-400: #22d3ee;
      --cyan-500: #06b6d4;
      --blue-400: #60a5fa;
      --blue-500: #3b82f6;
      --emerald-400: #34d399;
      --emerald-500: #10b981;
      --rose-400: #fb7185;
      --amber-400: #fbbf24;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--violet-500), var(--cyan-500));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-text { font-size: 18px; font-weight: 600; color: var(--text-primary); }
    .logo-text span { color: var(--violet-400); }

    .header-divider {
      width: 1px; height: 24px;
      background: var(--border);
    }

    .header-title {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .header-btn:hover {
      border-color: var(--violet-500);
      color: var(--text-primary);
    }

    .header-btn.primary {
      background: var(--violet-600);
      border-color: var(--violet-600);
      color: white;
    }

    .header-btn.primary:hover {
      background: var(--violet-500);
    }

    /* Main Layout */
    .main {
      padding-top: 60px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Messages Area */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .message {
      max-width: 900px;
      margin: 0 auto 24px;
      display: flex;
      gap: 16px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .avatar.user {
      background: var(--violet-500);
    }

    .avatar.assistant {
      background: linear-gradient(135deg, var(--violet-500), var(--cyan-500));
    }

    .message-content {
      flex: 1;
      padding-top: 6px;
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .message-author {
      font-weight: 600;
      font-size: 14px;
    }

    .message-time {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .message-text {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-primary);
    }

    .message-text p { margin-bottom: 12px; }
    .message-text p:last-child { margin-bottom: 0; }

    /* Cards */
    .card {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      margin: -16px -16px 16px;
      font-size: 14px;
      font-weight: 600;
    }

    .card-violet { border-color: rgba(139, 92, 246, 0.3); }
    .card-violet .card-header { background: rgba(139, 92, 246, 0.1); color: var(--violet-400); }

    .card-cyan { border-color: rgba(34, 211, 238, 0.3); }
    .card-cyan .card-header { background: rgba(34, 211, 238, 0.1); color: var(--cyan-400); }

    .card-blue { border-color: rgba(59, 130, 246, 0.3); }
    .card-blue .card-header { background: rgba(59, 130, 246, 0.1); color: var(--blue-400); }

    .card-emerald { border-color: rgba(16, 185, 129, 0.3); }
    .card-emerald .card-header { background: rgba(16, 185, 129, 0.1); color: var(--emerald-400); }

    /* Setup Cards */
    .setup-cards { margin-top: 16px; }

    .setup-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .setup-row:last-child { border-bottom: none; }

    .setup-label { color: var(--text-secondary); font-size: 12px; }
    .setup-value { color: var(--text-primary); }
    .setup-value.rose { color: var(--rose-400); }
    .setup-value.emerald { color: var(--emerald-400); }
    .setup-value.blue { color: var(--blue-400); }

    .setup-options {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .option-btn {
      flex: 1;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover { border-color: var(--violet-500); color: var(--text-primary); }
    .option-btn.selected {
      background: var(--violet-600);
      border-color: var(--violet-600);
      color: white;
    }

    /* === 个性化方案双层 UI === */
    .plan-business {
      padding: 20px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.08), rgba(59, 130, 246, 0.05));
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      margin-top: 12px;
    }

    .plan-understanding {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-primary);
      margin-bottom: 16px;
    }

    .plan-approach {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-secondary);
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      border-left: 3px solid var(--violet-500);
      margin-bottom: 16px;
    }

    .plan-promises {
      list-style: none;
      padding: 0;
      margin: 12px 0;
    }

    .plan-promises li {
      padding: 8px 0 8px 24px;
      position: relative;
      font-size: 14px;
      color: var(--text-primary);
      line-height: 1.5;
    }

    .plan-promises li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: var(--emerald-400);
      font-weight: 700;
    }

    .plan-vs-standard {
      font-size: 13px;
      color: var(--amber-400);
      padding: 10px 14px;
      background: rgba(251, 191, 36, 0.08);
      border-radius: 8px;
      margin-top: 12px;
    }

    .plan-vs-standard::before {
      content: '⚡ ';
    }

    /* 技术详情展开区域 */
    .tech-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 0;
      margin-top: 16px;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      border: none;
      background: none;
      transition: color 0.2s;
    }

    .tech-toggle:hover { color: var(--text-primary); }

    .tech-toggle .arrow {
      transition: transform 0.2s;
      font-size: 10px;
    }

    .tech-toggle.expanded .arrow {
      transform: rotate(90deg);
    }

    .tech-details {
      display: none;
      margin-top: 8px;
    }

    .tech-details.visible {
      display: block;
    }

    .tech-section {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .tech-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .tech-section-header:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .tech-section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .tech-section-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .tech-section-body {
      display: none;
      padding: 0 16px 14px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    .tech-section-body.visible {
      display: block;
    }

    .tech-section-body .reasoning {
      padding: 8px 12px;
      background: rgba(139, 92, 246, 0.06);
      border-radius: 6px;
      margin-bottom: 10px;
      color: var(--violet-400);
      font-size: 12px;
    }

    .tech-section-body .details {
      white-space: pre-wrap;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
    }

    .risk-item {
      padding: 8px 12px;
      background: rgba(251, 113, 133, 0.06);
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .risk-item .risk-label {
      color: var(--rose-400);
      font-size: 12px;
      font-weight: 600;
    }

    .risk-item .risk-mitigation {
      color: var(--text-secondary);
      font-size: 12px;
      margin-top: 4px;
    }

    .needs-more-info {
      margin-top: 12px;
      padding: 10px 14px;
      background: rgba(59, 130, 246, 0.08);
      border-radius: 8px;
      font-size: 13px;
      color: var(--blue-400);
    }

    .confidence-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .confidence-track {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .confidence-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.5s;
    }

    .confirm-btn {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: var(--violet-600);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .confirm-btn:hover { background: var(--violet-500); }

    .confirm-btn:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      cursor: not-allowed;
    }

    /* Progress Card - Figma Design */
    .progress-card {
      background: var(--bg-tertiary);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 12px;
      overflow: hidden;
      margin-top: 16px;
    }

    .progress-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(16, 185, 129, 0.1);
      border-bottom: 1px solid var(--border);
    }

    .progress-card-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--emerald-400);
      font-weight: 600;
      font-size: 14px;
    }

    .progress-card-body {
      padding: 20px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .progress-info-label {
      color: var(--text-secondary);
    }

    .progress-info-value {
      color: var(--emerald-400);
      font-family: 'JetBrains Mono', monospace;
    }

    .progress-bar {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--emerald-500), var(--emerald-400));
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .progress-controls {
      display: flex;
      gap: 8px;
    }

    .control-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-primary);
    }

    .control-btn.play {
      color: var(--emerald-400);
    }

    .control-btn.pause {
      color: var(--rose-400);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .metric-box {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 16px 12px;
      text-align: center;
    }

    .metric-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .metric-value {
      font-size: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
    }

    .metric-value.emerald { color: var(--emerald-300); }
    .metric-value.rose { color: var(--rose-400); }

    .pause-notice {
      margin-top: 16px;
      padding: 14px;
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.2);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pause-notice-text {
      font-size: 12px;
      color: var(--amber-400);
      text-align: center;
    }

    .checkpoint-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 6px;
      color: var(--amber-300);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      align-self: center;
    }

    .checkpoint-btn:hover {
      background: rgba(251, 191, 36, 0.25);
    }

    /* Evaluation Card - Figma Design */
    .evaluation-card {
      background: var(--bg-tertiary);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      overflow: hidden;
      margin-top: 16px;
    }

    .evaluation-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(139, 92, 246, 0.1);
      border-bottom: 1px solid var(--border);
      color: var(--violet-400);
      font-weight: 600;
      font-size: 14px;
    }

    .evaluation-card-body {
      padding: 16px;
    }

    .checkpoint-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .checkpoint-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .checkpoint-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(139, 92, 246, 0.3);
    }

    .checkpoint-item.selected {
      background: rgba(139, 92, 246, 0.1);
      border-color: rgba(139, 92, 246, 0.5);
    }

    .checkpoint-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .checkpoint-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .checkpoint-name strong {
      color: var(--emerald-400);
    }

    .checkpoint-desc {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .checkpoint-metrics {
      text-align: right;
    }

    .checkpoint-score {
      font-size: 16px;
      font-weight: 600;
      color: var(--emerald-400);
    }

    .checkpoint-score-sub {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .evaluation-summary {
      margin-top: 16px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .evaluation-summary strong {
      color: var(--violet-400);
    }

    .evaluation-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .action-btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .action-btn.primary {
      background: var(--violet-600);
      border: none;
      color: white;
    }

    .action-btn.primary:hover {
      background: var(--violet-500);
    }

    .action-btn.secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .action-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    /* Input Area */
    .input-area {
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      background: var(--bg-primary);
    }

    .input-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .input-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .toolbar-btn {
      padding: 6px 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .toolbar-btn:hover {
      border-color: var(--violet-500);
      color: var(--text-primary);
    }

    .input-box {
      display: flex;
      gap: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      align-items: flex-end;
    }

    .input-box:focus-within { border-color: var(--violet-500); }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      outline: none;
      min-height: 24px;
      max-height: 200px;
      font-family: inherit;
    }

    textarea::placeholder { color: var(--text-secondary); }

    .send-btn {
      width: 36px; height: 36px;
      background: var(--violet-600);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover { background: var(--violet-500); }
    .send-btn:disabled { background: rgba(255, 255, 255, 0.1); cursor: not-allowed; }

    /* File Upload */
    .upload-area {
      background: var(--bg-secondary);
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      margin-top: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .upload-area:hover { border-color: var(--cyan-500); }

    .upload-icon { font-size: 32px; margin-bottom: 8px; }
    .upload-text { font-size: 14px; color: var(--text-secondary); }
    .upload-hint { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

    /* File Preview */
    .file-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.2);
      border-radius: 8px;
      margin-top: 12px;
    }

    .file-icon { font-size: 20px; }
    .file-info { flex: 1; }
    .file-name { font-size: 14px; font-weight: 500; }
    .file-size { font-size: 12px; color: var(--text-secondary); }

    .file-remove {
      width: 24px; height: 24px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .file-remove:hover { color: var(--rose-400); }

    /* Loading Animation */
    .loading {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .loading-dot {
      width: 6px; height: 6px;
      background: var(--violet-400);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .loading-dot:nth-child(1) { animation-delay: -0.32s; }
    .loading-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Utility */
    .hidden { display: none !important; }

    /* Responsive */
    @media (max-width: 768px) {
      .header-title { display: none; }
      .header-divider { display: none; }
      .messages { padding: 16px; }
      .input-area { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <a href="/" class="logo">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M9 2L15.5 5.75V12.25L9 16L2.5 12.25V5.75L9 2Z" stroke="white" stroke-width="1.5" fill="none"/>
            <circle cx="9" cy="9" r="2" fill="white"/>
          </svg>
        </div>
        <span class="logo-text">Vibe<span>ML</span></span>
      </a>
      <div class="header-divider"></div>
      <span class="header-title">Chat / 新对话</span>
    </div>
    <div class="header-actions">
      <a href="/" class="header-btn">返回首页</a>
      <button class="header-btn primary" onclick="startNewChat()">+ 新对话</button>
    </div>
  </header>

  <!-- Main -->
  <main class="main">
    <!-- Messages -->
    <div class="messages" id="messages">
      <!-- Welcome Message -->
      <div class="message">
        <div class="avatar assistant">🤖</div>
        <div class="message-content">
          <div class="message-header">
            <span class="message-author">VibeML Assistant</span>
            <span class="message-time">刚刚</span>
          </div>
          <div class="message-text">
            <p>👋 欢迎使用 VibeML！我是你的专属 AI 算法专家。</p>
            <p>我可以帮你：</p>
            <ul style="margin: 8px 0; padding-left: 20px;">
              <li>分析业务需求并编译为训练方案</li>
              <li>自动完成数据预处理、特征工程</li>
              <li>搜索最优超参数和模型架构</li>
              <li>提供可部署的模型权重</li>
            </ul>
            <p>你可以用最自然的语言描述你的精细业务需求，并上传数据（CSV、Excel、ZIP 等）。我会将你模糊的业务语言，精准编译为包含特制数据处理、专属损失函数和定制模型架构的端到端训练流。</p>
          </div>

          <!-- Upload Area -->
          <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📁</div>
            <div class="upload-text">点击或拖拽上传数据集</div>
            <div class="upload-hint">支持 CSV, XLSX, ZIP, 7Z 格式</div>
          </div>
          <input type="file" id="fileInput" class="hidden" accept=".csv,.xlsx,.xls,.zip,.7z" onchange="handleFileSelect(event)">
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-container">
        <div class="input-toolbar">
          <button class="toolbar-btn" onclick="document.getElementById('fileInput').click()">
            📎 上传文件
          </button>
          <button class="toolbar-btn" onclick="promptLinkImport()">
            🔗 链接导入
          </button>
          <button class="toolbar-btn" onclick="showHelp()">
            ❓ 帮助
          </button>
          <button class="toolbar-btn" onclick="clearContext()">
            🗑️ 清空
          </button>
        </div>
        <div class="input-box">
          <textarea id="messageInput" placeholder="描述你的精细业务需求，例如：我有一份电商记录，想找出快流失的高价值用户，宁可误报也别漏报..." rows="1"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API = '/api';
    let currentSessionId = null;
    let currentFile = null;
    let isWaitingResponse = false;
    let currentDatasetId = null;
    let currentJobId = null;
    let selectedPriority = 'quality';
    let selectedAugStrength = 'standard';

    // Auto-resize textarea
    const textarea = document.getElementById('messageInput');
    textarea.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 200) + 'px';
    });

    // Enter to send
    textarea.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) handleFile(file);
    }

    function handleFile(file) {
      currentFile = file;

      const filePreview = document.createElement('div');
      filePreview.className = 'file-preview';
      filePreview.id = 'filePreview';
      filePreview.innerHTML = `
        <div class="file-icon">📊</div>
        <div class="file-info">
          <div class="file-name">${file.name}</div>
          <div class="file-size">${formatFileSize(file.size)}</div>
        </div>
        <button class="file-remove" onclick="removeFile()">✕</button>
      `;

      const existingPreview = document.getElementById('filePreview');
      if (existingPreview) existingPreview.remove();

      const uploadArea = document.getElementById('uploadArea');
      if (uploadArea) uploadArea.style.display = 'none';

      const lastMessage = document.querySelector('.message:last-child .message-content');
      if (lastMessage) lastMessage.appendChild(filePreview);

      addMessage('user', `我准备了一个数据集：${file.name}`);
      uploadFile(file);
    }

    function removeFile() {
      currentFile = null;
      const preview = document.getElementById('filePreview');
      if (preview) preview.remove();
      const uploadArea = document.getElementById('uploadArea');
      if (uploadArea) uploadArea.style.display = 'block';
    }

    // isBusinessQuery 已移除 — 是否是 ML 需求由后端 LLM 判断

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    async function uploadFile(file) {
      showLoading();

      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch(`${API}/data/upload`, {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.success || data.dataset_id) {
          currentDatasetId = data.dataset_id;
          addMessage('assistant', `
            <p>📂 数据已接收（${data.n_rows} 行 × ${data.n_cols} 列），正在让 AI 分析数据结构...</p>
          `);

          // 自动触发 LLM 数据探索
          await exploreDataset(data.dataset_id);
        } else {
          throw new Error(data.message || '上传失败');
        }
      } catch (e) {
        hideLoading();
        addMessage('assistant', `<p>❌ 上传失败: ${e.message}</p>`);
      }
    }

    async function importFromLink(url) {
      showLoading();
      addMessage('user', `通过链接导入数据：${url}`);

      try {
        const response = await fetch(`${API}/data/import-link`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        });

        const data = await response.json();

        if (data.success || data.dataset_id) {
          currentDatasetId = data.dataset_id;
          addMessage('assistant', `
            <p>📂 数据已从链接导入（${data.n_rows} 行 × ${data.n_cols} 列），正在让 AI 分析数据结构...</p>
          `);
          await exploreDataset(data.dataset_id);
        } else {
          throw new Error(data.detail || data.message || '导入失败');
        }
      } catch (e) {
        hideLoading();
        addMessage('assistant', `<p>❌ 链接导入失败: ${e.message}</p><p style="color: var(--text-secondary); font-size: 13px;">请确保链接可公开访问。Google Drive 文件需设为"知道链接的人可查看"。</p>`);
      }
    }

    async function exploreDataset(datasetId) {
      try {
        const response = await fetch(`${API}/data/${datasetId}/explore`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_goal: '' })
        });

        const data = await response.json();
        hideLoading();

        if (data.exploration) {
          showDataExploration(data);
        } else {
          addMessage('assistant', '<p>数据分析完成，但未获得详细结果。请描述你的业务目标。</p>');
        }
      } catch (e) {
        hideLoading();
        addMessage('assistant', `<p>⚠️ AI 数据分析暂时不可用。请直接描述你的业务目标。</p>`);
      }
    }

    function showDataExploration(data) {
      const exp = data.exploration;
      const spec = data.updated_spec || {};
      const understanding = exp.data_understanding || {};
      const targetRec = exp.target_recommendation || {};
      const qualityReport = exp.data_quality_report || {};
      const colAnalysis = understanding.columns_analysis || [];

      // 业务摘要
      let html = `<p>🔍 <strong>AI 数据分析完成</strong></p>`;

      if (exp.business_summary) {
        html += `<div class="plan-business" style="margin-top: 8px;">
          <div class="plan-understanding">${exp.business_summary}</div>
        </div>`;
      }

      // Target 推荐
      if (targetRec.column) {
        const confPct = Math.round((targetRec.confidence || 0) * 100);
        const confColor = confPct >= 70 ? 'var(--emerald-400)' : confPct >= 40 ? 'var(--amber-400)' : 'var(--rose-400)';
        html += `
          <div class="card card-emerald" style="margin-top: 12px;">
            <div class="card-header"><span>🎯</span><span>AI 识别的预测目标</span></div>
            <div style="padding: 4px 0;">
              <div class="setup-row">
                <span class="setup-label">推荐目标列</span>
                <span class="setup-value emerald" style="font-weight: 600;">${targetRec.column}</span>
              </div>
              <div class="setup-row">
                <span class="setup-label">任务类型</span>
                <span>${targetRec.task_type || '待确认'}</span>
              </div>
              <div class="setup-row">
                <span class="setup-label">判断依据</span>
                <span style="font-size: 12px; color: var(--text-secondary);">${targetRec.reasoning || ''}</span>
              </div>
              <div class="confidence-bar" style="margin-top: 8px;">
                <span>置信度</span>
                <div class="confidence-track">
                  <div class="confidence-fill" style="width: ${confPct}%; background: ${confColor};"></div>
                </div>
                <span style="color: ${confColor}">${confPct}%</span>
              </div>
            </div>
          </div>`;
      }

      // 列角色分析（展开查看）
      if (colAnalysis.length > 0) {
        const exploreId = 'col-explore-' + Date.now();
        html += `
          <button class="tech-toggle" onclick="toggleTechDetails('${exploreId}', this)">
            <span class="arrow">▶</span>
            <span>📋 查看每列的详细分析（${colAnalysis.length} 列）</span>
          </button>
          <div class="tech-details" id="${exploreId}">`;

        for (const col of colAnalysis) {
          const roleColors = { target: 'var(--emerald-400)', feature: 'var(--blue-400)', id: 'var(--text-secondary)', exclude: 'var(--rose-400)', datetime_index: 'var(--amber-400)' };
          const roleColor = roleColors[col.role] || 'var(--text-secondary)';
          const roleLabels = { target: '🎯 目标', feature: '📊 特征', id: '🔑 ID', exclude: '🚫 排除', datetime_index: '📅 时间索引' };
          const roleLabel = roleLabels[col.role] || col.role;

          html += `
            <div class="tech-section">
              <div class="tech-section-header" onclick="toggleSection('col-${col.name}')">
                <div>
                  <div class="tech-section-title">${col.name} <span style="color: ${roleColor}; font-size: 11px; font-weight: normal;">${roleLabel}</span></div>
                  <div class="tech-section-subtitle">${col.business_meaning || ''}</div>
                </div>
                <span style="color: var(--text-secondary); font-size: 10px;">▼</span>
              </div>
              <div class="tech-section-body" id="col-${col.name}">
                ${col.role_reason ? `<div class="reasoning">💡 ${col.role_reason}</div>` : ''}
                ${col.data_quality ? `<div class="details" style="margin-bottom: 6px;"><strong>数据质量：</strong>${col.data_quality}</div>` : ''}
                ${col.engineering_hint ? `<div class="details"><strong>工程建议：</strong>${col.engineering_hint}</div>` : ''}
              </div>
            </div>`;
        }
        html += '</div>';
      }

      // 数据质量问题
      if (qualityReport.issues && qualityReport.issues.length > 0) {
        html += `<div class="needs-more-info" style="margin-top: 12px;">
          ⚠️ <strong>数据质量提醒</strong>（${qualityReport.issues.length} 个问题）：
          <ul style="margin: 6px 0 0 16px; font-size: 12px;">
            ${qualityReport.issues.map(issue =>
              `<li style="color: ${issue.severity === 'high' ? 'var(--rose-400)' : 'var(--text-secondary)'};">${issue.description}${issue.suggestion ? ' → ' + issue.suggestion : ''}</li>`
            ).join('')}
          </ul>
        </div>`;
      }

      // 下一步引导
      html += `<p style="margin-top: 16px;">现在请描述你的<strong>业务目标和约束</strong>，我会根据数据结构定制训练方案。</p>`;

      if (exp.suggested_next_steps && exp.suggested_next_steps.length > 0) {
        html += `<div style="margin-top: 8px; font-size: 13px; color: var(--text-secondary);">
          💡 建议：${exp.suggested_next_steps.join('；')}
        </div>`;
      }

      addMessage('assistant', html);
    }

    function promptLinkImport() {
      const url = prompt('请粘贴数据链接：\n\n支持：\n• Google Drive 分享链接\n• Google Sheets 链接\n• 任何公开的 CSV/Excel 下载链接');
      if (url && url.trim()) {
        importFromLink(url.trim());
      }
    }

    // ===== 公开数据集搜索 + 合成数据 =====

    async function searchPublicDatasets() {
      showLoading();
      addMessage('assistant', '<p>🔍 正在搜索匹配你需求的公开数据集...</p>');

      // 从最近的对话中提取用户目标
      const msgs = document.querySelectorAll('.message');
      let userGoal = '';
      msgs.forEach(m => {
        const author = m.querySelector('.message-author');
        const text = m.querySelector('.message-text');
        if (author && author.textContent === 'You' && text) {
          const t = text.textContent.trim();
          if (t.length > 5) userGoal = t;
        }
      });

      if (!userGoal) {
        hideLoading();
        addMessage('assistant', '<p>请先描述你的业务需求，我再帮你搜索数据。</p>');
        return;
      }

      try {
        const response = await fetch(`${API}/data/search-public`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_goal: userGoal })
        });

        const data = await response.json();
        hideLoading();
        showDataSearchResults(data, userGoal);
      } catch (e) {
        hideLoading();
        addMessage('assistant', `<p>❌ 搜索失败: ${e.message}</p>`);
      }
    }

    function showDataSearchResults(data, userGoal) {
      const llm = data.llm_suggestions || {};
      const hfResults = data.huggingface_results || [];
      const llmDatasets = llm.recommended_datasets || [];
      const synPlan = llm.synthetic_data_plan;

      let html = '<p>📦 <strong>为你找到以下数据源选项：</strong></p>';

      // LLM 综合建议
      if (llm.recommendation) {
        html += `<div class="plan-approach" style="margin-top: 8px;">${llm.recommendation}</div>`;
      }

      // LLM 推荐的数据集
      if (llmDatasets.length > 0) {
        html += '<div style="margin-top: 12px; font-size: 13px; color: var(--text-secondary);">🤖 AI 推荐的数据集：</div>';
        for (const ds of llmDatasets.slice(0, 5)) {
          const score = ds.relevance_score ? `匹配度 ${Math.round(ds.relevance_score * 100)}%` : '';
          html += `
            <div class="tech-section" style="margin-top: 6px;">
              <div style="padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <div style="font-weight: 600; font-size: 13px;">${ds.name}</div>
                  <div style="font-size: 12px; color: var(--text-secondary); margin-top: 2px;">
                    ${ds.source || ''} ${ds.size_hint ? '· ' + ds.size_hint : ''} ${score ? '· ' + score : ''}
                  </div>
                  <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">${ds.description || ''}</div>
                </div>
                <button class="option-btn" style="flex: none; padding: 6px 14px;" onclick="usePublicDataset('${encodeURIComponent(ds.url || '')}', '${encodeURIComponent(ds.name)}')">
                  使用
                </button>
              </div>
            </div>`;
        }
      }

      // HuggingFace 实际搜索结果
      if (hfResults.length > 0) {
        html += '<div style="margin-top: 16px; font-size: 13px; color: var(--text-secondary);">🤗 HuggingFace 搜索结果：</div>';
        for (const ds of hfResults.slice(0, 5)) {
          html += `
            <div class="tech-section" style="margin-top: 6px;">
              <div style="padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <div style="font-weight: 600; font-size: 13px;">${ds.name}</div>
                  <div style="font-size: 12px; color: var(--text-secondary); margin-top: 2px;">
                    ⬇ ${ds.downloads?.toLocaleString() || '?'} 下载 · ❤ ${ds.likes || 0}
                  </div>
                </div>
                <div style="display: flex; gap: 6px;">
                  <a href="${ds.url}" target="_blank" class="option-btn" style="text-decoration: none; padding: 6px 10px; font-size: 11px;">查看</a>
                  <button class="option-btn" style="padding: 6px 14px;" onclick="usePublicDataset('${encodeURIComponent(ds.url)}', '${encodeURIComponent(ds.name)}')">
                    使用
                  </button>
                </div>
              </div>
            </div>`;
        }
      }

      // 合成数据选项
      if (synPlan) {
        html += `
          <div style="margin-top: 16px; padding: 14px; background: rgba(16, 185, 129, 0.06); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 10px;">
            <div style="font-weight: 600; font-size: 13px; color: var(--emerald-400);">🧪 备选：AI 合成数据</div>
            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 6px;">${synPlan.description || ''}</div>
            ${synPlan.caveats ? `<div style="font-size: 11px; color: var(--amber-400); margin-top: 6px;">⚠ ${synPlan.caveats}</div>` : ''}
            <button class="confirm-btn" onclick="confirmGenerateSynthetic()" style="margin-top: 10px; background: var(--emerald-500); font-size: 12px; padding: 8px;">
              🧪 生成 ${synPlan.suggested_rows || 500} 行合成数据
            </button>
          </div>`;

        // 存储 plan 供后续使用
        window._syntheticPlan = synPlan;
        window._userGoal = userGoal;
      }

      addMessage('assistant', html);
    }

    async function usePublicDataset(encodedUrl, encodedName) {
      const url = decodeURIComponent(encodedUrl);
      const name = decodeURIComponent(encodedName);

      showLoading();
      addMessage('user', `使用公开数据集：${name}`);

      try {
        const response = await fetch(`${API}/data/download-public`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url, dataset_name: name })
        });

        const data = await response.json();

        if (data.success || data.dataset_id) {
          currentDatasetId = data.dataset_id;
          addMessage('assistant', `<p>📂 公开数据集已导入（${data.n_rows} 行 × ${data.n_cols} 列），正在分析...</p>`);
          await exploreDataset(data.dataset_id);
        } else {
          throw new Error(data.detail || '下载失败');
        }
      } catch (e) {
        hideLoading();
        addMessage('assistant', `<p>❌ 数据集下载失败: ${e.message}</p><p style="font-size: 12px; color: var(--text-secondary);">提示：部分数据集需要特殊格式处理，你可以手动从 HuggingFace 下载后上传。</p>`);
      }
    }

    async function generateSyntheticData() {
      window._userGoal = '';
      // 提取用户目标
      const msgs = document.querySelectorAll('.message');
      msgs.forEach(m => {
        const author = m.querySelector('.message-author');
        const text = m.querySelector('.message-text');
        if (author && author.textContent === 'You' && text) {
          const t = text.textContent.trim();
          if (t.length > 5) window._userGoal = t;
        }
      });

      if (!window._userGoal) {
        addMessage('assistant', '<p>请先描述你的业务需求，我再帮你生成合成数据。</p>');
        return;
      }

      showLoading();
      addMessage('assistant', '<p>🧪 正在根据你的需求生成合成训练数据...</p>');

      try {
        const response = await fetch(`${API}/data/generate-synthetic`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_goal: window._userGoal,
            schema: [],
            n_rows: 500
          })
        });

        const data = await response.json();

        if (data.success || data.dataset_id) {
          currentDatasetId = data.dataset_id;
          hideLoading();
          addMessage('assistant', `
            <p>✅ 合成数据已生成！（${data.n_rows} 行 × ${data.n_cols} 列）</p>
            ${data.caveat ? `<div class="needs-more-info" style="margin-top: 8px;">💡 ${data.caveat}</div>` : ''}
          `);
          await exploreDataset(data.dataset_id);
        } else {

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();

      if (!text || isWaitingResponse) return;

      // 检测是否是数据链接（Google Drive / Sheets / CSV 下载链接）
      const linkPatterns = [
        /drive\.google\.com\/(file\/d|open\?id)/,
        /docs\.google\.com\/spreadsheets/,
        /^https?:\/\/.+\.(csv|xlsx|xls|zip)(\?|$)/i,
      ];
      if (linkPatterns.some(p => p.test(text))) {
        input.value = '';
        input.style.height = 'auto';
        importFromLink(text);
        return;
      }

      // 所有其他输入发给后端，由 LLM 判断
      addMessage('user', text);
      input.value = '';
      input.style.height = 'auto';

      showLoading();
      isWaitingResponse = true;

      try {
        // Use the legacy API for now
        const response = await fetch(`${API}/intent/clarify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_goal: text,
            must_keep: [],
            can_change: [],
            worst_errors: [],
            priority: 'quality',
            dataset_id: currentDatasetId
          })
        });

        const data = await response.json();

        hideLoading();

        if (data.is_ambiguous) {
          showClarification(data);
        } else {
          showSetupCards(data);
        }
      } catch (e) {
        hideLoading();
        addMessage('assistant', `<p>❌ 处理失败: ${e.message}</p>`);
      }

      isWaitingResponse = false;
    }

    function startProgressPolling(jobId) {
      const pollInterval = setInterval(() => {
        // Simulated progress update for demo
        if (window.trainingPaused) return;

        window.currentEpoch = (window.currentEpoch || 0) + Math.floor(Math.random() * 3) + 1;
        if (window.currentEpoch > 100) window.currentEpoch = 100;

        const epoch = window.currentEpoch;
        const valRecall = (0.4 + (epoch / 100) * 0.52).toFixed(3);
        const progress = epoch;

        const epochNum = document.getElementById('epochNum');
        const valRecallEl = document.getElementById('valRecall');
        const progressFill = document.getElementById('progressFill');
        const actionConstraint = document.getElementById('actionConstraint');
        const fnWeight = document.getElementById('fnWeight');
        const checkpointEpoch = document.getElementById('checkpointEpoch');

        if (epochNum) epochNum.textContent = epoch;
        if (valRecallEl) valRecallEl.textContent = `val_recall: ${valRecall}`;
        if (progressFill) progressFill.style.width = `${progress}%`;
        if (actionConstraint) actionConstraint.textContent = `${Math.floor(epoch * 4.9)} / 500`;
        if (fnWeight) fnWeight.textContent = `Auto 调优中: 5.${Math.floor(epoch / 10)}x`;
        if (checkpointEpoch) checkpointEpoch.textContent = epoch;

        if (epoch >= 100) {
          clearInterval(pollInterval);
          showTrainingComplete(jobId);
        }
      }, 400);
    }

        <ul style="margin: 8px 0; padding-left: 20px;">
          <li>系统会自动编译意图并推荐方案</li>
          <li>确认方案后开始训练</li>
          <li>训练完成后可下载模型产物</li>
        </ul>
      `);
    }

    function clearContext() {
      if (confirm('确定要清空当前对话吗？')) {
        location.reload();
      }
    }

    function submitClarification() {
      // Simplified - just acknowledge
      addMessage('assistant', '<p>感谢你的补充！让我重新编译意图...</p>');
    }
  </script>
